tujuan:()=>`<h2>Tujuan dan Petunjuk</h2><div class="stage">🧒</div><div class="panel"><ul><li>Menjelaskan literasi digital dan 4 pilarnya.</li><li>Mengenali hoaks dan memverifikasi informasi.</li><li>Menerapkan keamanan digital dan melindungi data pribadi.</li><li>Menerapkan etika digital: netiket, perundungan siber, hak cipta.</li><li>Menjelaskan jejak digital dan dampaknya.</li></ul><p>Petunjuk: jelajahi materi, selesaikan misi, kerjakan 20 soal. Jawaban salah boleh dicoba lagi.</p></div>${nav("menu","konsep")}`,
konsep:()=>`<h2>Mengenal Konsep Utama</h2><div class="panel"><p><b>Literasi digital</b> adalah kemampuan menggunakan teknologi digital untuk mencari, memahami, mengevaluasi, membuat, dan membagikan informasi secara cakap, aman, etis, dan bertanggung jawab.</p></div><div class="grid"><div class="card">🟦 <b>Cakap Digital</b><br>Mengoperasikan perangkat dan menyaring informasi.</div><div class="card">🟩 <b>Aman Digital</b><br>Melindungi data, kata sandi, dan akun.</div><div class="card">🟧 <b>Etis Digital</b><br>Santun, tanpa hoaks, menghargai hak cipta.</div><div class="card">🟪 <b>Budaya Digital</b><br>Nilai Pancasila dan keberagaman di ruang digital.</div></div>${nav("tujuan","eks1")}`,
eks1:()=>`<h2>Eksplorasi 1: Cakap dan Aman Digital</h2><div class="card"><b>🔍 Cek fakta 5 langkah</b><br>Cek sumber · penulis dan tanggal · bukti/data · bandingkan media tepercaya · pencarian gambar terbalik untuk foto.<br><i>Ciri hoaks: judul provokatif, memancing emosi, minta disebarkan, tanpa sumber.</i></div><div class="card"><b>🔐 Kata sandi kuat</b><br>Minimal 12 karakter, kombinasi huruf besar-kecil, angka, simbol, berbeda untuk tiap akun. Aktifkan autentikasi dua faktor (2FA).</div><div class="card"><b>🎣 Phishing dan data pribadi</b><br>Pesan hadiah atau mendesak: jangan klik, jangan isi data, jangan bagikan OTP. Jangan unggah alamat lengkap, ID, atau jadwal rumah kosong. Hindari transaksi sensitif di Wi-Fi publik.</div>${nav("konsep","eks2")}`,
eks2:()=>`<h2>Eksplorasi 2: Etis dan Budaya Digital</h2><div class="card"><b>👣 Jejak digital</b><br>Rekam aktivitas online (unggahan, komentar, riwayat) yang sulit dihapus sepenuhnya.</div><div class="card"><b>💬 Netiket</b><br>Bahasa santun, hormati perbedaan, hindari SARA. Pikir dulu: benar? perlu? baik? aman?</div><div class="card"><b>🛡️ Perundungan siber</b><br>Jangan membalas, simpan bukti, blokir/laporkan, ceritakan pada orang dewasa tepercaya.</div><div class="card"><b>©️ Hak cipta</b><br>Cantumkan sumber, pilih gambar/musik berlisensi bebas, jangan klaim karya orang lain.</div>${nav("eks1","misi")}`,
misi:()=>{const n=Object.values(misi).filter(x=>x.ok).length,d=Object.keys(misi).length;return`<h2>Misi: Perburuan Hoaks di Pasar Data</h2><p>Tentukan tiap unggahan: <b>Fakta</b> atau <b>Hoaks</b>. Kristal: ${n} / 6</p><div class="bar"><i style="width:${n/6*100}%"></i></div>${MISI.map((m,i)=>`<div class="card"><p>${i+1}. ${m[0]}</p>${misi[i]?`<b>${misi[i].ok?"✅ Tepat!":"❌ Belum tepat."}</b> Jawaban: ${m[1]?"Hoaks":"Fakta"}`:`<button class="btn t" onclick="mj(${i},0)">FAKTA</button><button class="btn o" onclick="mj(${i},1)">HOAKS</button>`}</div>`).join("")}${d==6?`<div class="fb ${n>4?"ok":"no"}"><b>${n>4?"Detektif Hoaks Hebat!":n>2?"Hampir! Cek lagi ciri hoaks.":"Ayo pelajari materi cek fakta lagi."}</b> <button class="btn g" onclick="go('eks1')">Pelajari Ulang</button></div>`:""}${nav("eks2","evalmulai")}`},
evalmulai:()=>`<h2>Arena Kristal: Evaluasi</h2><div class="stage">💎🧒</div><div class="panel"><p>20 soal: 16 pilihan ganda dan 4 benar-salah. Jawaban benar membuka respons sukses; jawaban salah boleh dicoba lagi. Nilai dihitung otomatis dari jawaban yang benar pada percobaan pertama (× 5).</p></div><button class="btn o" onclick="qi=0;first=[];go('soal')">MULAI KUIS</button><button class="btn g" onclick="go('menu')">Beranda</button>`,
hasil:()=>{const c=first.filter(x=>x===1).length,nilai=c*5,miss={k:0,a:0,e:0};first.forEach((x,i)=>{if(x===0)miss[G[i]]++});const R=[["k","Konsep dan 4 pilar","konsep"],["a","Cakap dan Aman Digital","eks1"],["e","Etis dan Budaya Digital","eks2"]].filter(r=>miss[r[0]]);return`<h2>Hasil Evaluasi</h2><div class="stage">🏆</div><div class="panel"><p style="font-size:26px;margin:0"><b>${c} / 20 benar</b> pada percobaan pertama · Nilai <b>${nilai}</b></p><p>${nilai>=90?"Penjaga Dunia Digital sejati!":nilai>=70?"Hebat! Tinggal sedikit lagi.":nilai>=50?"Bagus! Ayo perkuat beberapa bagian.":"Semangat! Pelajari ulang materinya."}</p></div>${R.length?`<h2>Pelajari ulang</h2>${R.map(r=>`<button class="btn t" onclick="go('${r[2]}')">${r[1]} (${miss[r[0]]} salah)</button>`).join("")}`:"<p>Semua materi sudah kamu kuasai!</p>"}<p><button class="btn g" onclick="go('menu')">KEMBALI KE MENU</button><button class="btn o" onclick="qi=0;first=[];go('soal')">ULANGI KUIS</button><button class="btn" onclick="go('tutup')">SELESAI</button></p>`},
tutup:()=>`<div class="stage">🧒🎆🤖</div><h1>Kamu Penjaga Dunia Digital!</h1><p>Cakap, aman, etis, dan berbudaya di setiap klik.</p><div class="panel"><p>Dikembangkan oleh Mohamad Saikhul Arif · SMP DAFI · Informatika SMP Fase D · 2026</p></div><button class="btn g" onclick="go('menu')">KEMBALI KE MENU</button><button class="btn o" onclick="go('cover')">ULANGI PEMBELAJARAN</button>`
};
function soal(fb){const q=Q[qi];const done=fb==="ok";return`<p class="pill">Soal ${qi+1} dari 20</p><div class="bar"><i style="width:${(qi+(done?1:0))/20*100}%"></i></div><div class="panel"><p style="font-size:19px;margin:0"><b>${q[0]}</b></p></div>${q[1].map((o,i)=>`<button class="opt" ${done?"disabled":""} onclick="ans(${i})">${q[1].length==4?"ABCD"[i]+". ":""}${o}</button>`).join("")}${fb==="ok"?`<div class="fb ok"><big>🌟</big><b>Hebat! Jawaban kamu benar. Teruskan petualanganmu!</b><p>${q[3]}</p><button class="btn o" onclick="nextQ()">LANJUT</button></div>`:fb==="no"?`<div class="fb no"><big>💪</big><b>Belum tepat, ayo coba lagi! Kamu pasti bisa!</b><p>Petunjuk: ${q[4]}</p><button class="btn t" onclick="render('soal')">COBA LAGI</button></div>`:""}<p><button class="btn g" onclick="go('menu')">Beranda</button></p>`}
function ans(i){if(first[qi]===undefined)first[qi]=i===Q[qi][2]?1:0;A.innerHTML=soal(i===Q[qi][2]?"ok":"no");window.scrollTo(0,document.body.scrollHeight)}
function nextQ(){qi++;if(qi>=20)go("hasil");else render("soal")}
function mj(i,v){misi[i]={ok:MISI[i][1]===v};render("misi")}
function render(s){A.innerHTML=s==="soal"?soal():S[s]();window.scrollTo(0,0)}
function go(s){if(s==="misi"&&false)misi={};render(s)}
const D=(t,b)=>`<details class="card"><summary>${t}</summary>${b}</details>`;
S.konsep=()=>`<h2>Mengenal Konsep Utama</h2><p class="note">Klik tiap judul untuk membaca penjelasan lengkapnya.</p>`+D("📘 Apa itu literasi digital?",`<p>Literasi digital bukan sekadar bisa memakai ponsel atau internet. Ini adalah kemampuan <b>menggunakan teknologi digital untuk mencari, memahami, menilai, membuat, dan membagikan informasi</b> secara cakap, aman, etis, dan bertanggung jawab.</p><p>Bedakan dua hal: <b>bisa memakai</b> (misalnya lancar membuka media sosial) dan <b>paham memakai dengan bijak</b> (tahu mana informasi yang layak dipercaya, tahu risiko membagikan data, dan tahu dampak komentar kita pada orang lain). Literasi digital menuntut yang kedua.</p>`)+D("🌍 Mengapa penting bagi remaja?",`<p>Remaja menghabiskan banyak waktu di internet: belajar, bermain gim, bersosial media. Di ruang ini informasi mengalir sangat cepat, siapa saja bisa menjadi pembuat konten, dan tidak semua yang tampak meyakinkan itu benar.</p><p>Tanpa literasi digital, kita mudah tertipu hoaks dan penipuan online, tanpa sadar membocorkan data pribadi, atau menyakiti orang lain lewat komentar. Dengan literasi digital, internet menjadi alat untuk belajar, berkarya, dan membangun reputasi yang baik, bahkan untuk peluang di masa depan seperti beasiswa dan pekerjaan.</p>`)+D("🟦 Pilar 1: Cakap Digital",`<p>Cakap digital adalah kemampuan <b>mengoperasikan perangkat dan aplikasi serta mengelola informasi</b>. Termasuk di dalamnya: memakai kata kunci yang tepat saat mencari, membandingkan beberapa sumber, memilah informasi yang relevan, dan membuat konten sendiri (tulisan, gambar, video, presentasi).</p><p><b>Contoh:</b> saat mengerjakan tugas, kamu tidak hanya menyalin hasil pencarian pertama, tetapi membaca beberapa sumber, memeriksa siapa penulisnya, lalu merangkum dengan kata-katamu sendiri.</p>`)+D("🟩 Pilar 2: Aman Digital",`<p>Aman digital adalah kemampuan <b>melindungi diri, perangkat, dan data</b> di dunia maya. Ancaman yang umum: pencurian akun, penipuan (phishing), perangkat lunak berbahaya, dan penyalahgunaan data pribadi.</p><p><b>Contoh:</b> memakai kata sandi berbeda untuk tiap akun, mengaktifkan verifikasi dua langkah, dan tidak pernah memberikan kode OTP kepada siapa pun, termasuk yang mengaku petugas resmi.</p>`)+D("🟧 Pilar 3: Etis Digital",`<p>Etis digital adalah kemampuan <b>menerapkan etika dalam berinteraksi dan berkarya</b> secara online: berkomunikasi santun, tidak menyebarkan hoaks, tidak merundung, dan menghargai hak cipta.</p><p><b>Contoh:</b> sebelum membagikan berita, kamu memeriksanya dulu. Saat memakai gambar orang lain di tugasmu, kamu mencantumkan sumbernya. Ingat: di balik setiap akun ada manusia nyata dengan perasaan.</p>`)+D("🟪 Pilar 4: Budaya Digital",`<p>Budaya digital adalah kemampuan <b>menerapkan nilai-nilai kebangsaan dan keberagaman</b> di ruang digital: nilai Pancasila, toleransi, gotong royong, dan penghormatan pada perbedaan suku, agama, dan budaya.</p><p><b>Contoh:</b> menolak ujaran kebencian, tidak mengejek perbedaan, ikut menyebarkan konten positif tentang budaya daerah, dan menghormati aturan serta norma yang berlaku di komunitas online.</p>`)+D("🔗 Bagaimana keempat pilar saling terkait?",`<p>Keempat pilar bekerja sebagai satu kesatuan. Orang yang <b>cakap</b> tetapi tidak <b>etis</b> bisa menyalahgunakan kemampuannya. Orang yang <b>etis</b> tetapi tidak <b>aman</b> mudah menjadi korban penipuan. Orang yang <b>aman</b> tetapi tidak punya <b>budaya digital</b> bisa tetap menyakiti orang lain tanpa sadar. Karena itu, literasi digital yang utuh membutuhkan keempatnya.</p>`)+nav("tujuan","eks1");
S.eks1=()=>`<h2>Eksplorasi 1: Cakap dan Aman Digital</h2><p class="note">Klik tiap judul untuk membaca penjelasan lengkapnya.</p>`+D("🔍 Mencari dan menilai informasi",`<p>Gunakan kata kunci yang spesifik (misalnya “dampak begadang bagi remaja” lebih baik daripada “begadang”). Buka beberapa sumber, bukan hanya hasil teratas, karena urutan pencarian tidak menjamin kebenaran.</p><p>Nilai sumber dengan bertanya: <b>Siapa penulisnya? Kapan ditulis? Apa tujuannya? Apakah ada data atau rujukan?</b> Situs resmi lembaga, jurnal, dan media berita yang punya redaksi umumnya lebih tepercaya daripada akun anonim.</p>`)+D("🚩 Mengenali hoaks",`<p>Hoaks adalah informasi palsu atau menyesatkan yang sengaja dibuat tampak benar. Bentuknya beragam: <b>berita karangan</b> (isi sepenuhnya palsu), <b>konteks salah</b> (foto atau video asli tetapi dipakai untuk peristiwa lain), <b>konten manipulasi</b> (gambar atau suara diedit), dan <b>judul menyesatkan</b> (judul tidak sesuai isi).</p><p>Ciri umum: judul provokatif dan huruf kapital berlebihan, memancing marah atau takut, meminta disebarkan segera, tanpa sumber atau tanggal, dan mengklaim hasil ajaib. Hoaks sengaja menyasar emosi agar kita membagikan sebelum berpikir.</p><p><b>Dampaknya nyata:</b> memicu kepanikan, merusak nama baik orang, memecah belah masyarakat, dan merugikan secara kesehatan atau keuangan.</p>`)+D("✅ Cek fakta dalam 5 langkah",`<p><b>1. Cek sumber:</b> apakah berasal dari media atau lembaga yang jelas? Waspadai nama situs yang meniru situs resmi.</p><p><b>2. Cek penulis dan tanggal:</b> berita lama sering diedarkan ulang seolah-olah baru.</p><p><b>3. Cek bukti:</b> adakah data, narasumber, atau rujukan yang bisa ditelusuri?</p><p><b>4. Bandingkan:</b> apakah media tepercaya lain memberitakan hal yang sama? Jika hanya satu sumber yang tak dikenal, berhati-hatilah.</p><p><b>5. Cek foto atau video:</b> gunakan pencarian gambar terbalik untuk melihat apakah gambar itu pernah muncul sebelumnya pada peristiwa lain.</p><p><b>Aturan emas:</b> jika ragu, jangan bagikan.</p>`)+D("🔐 Kata sandi yang kuat",`<p>Kata sandi lemah (tanggal lahir, nama, “12345”) mudah ditebak oleh program otomatis. Kata sandi yang kuat <b>panjang (minimal 12 karakter)</b>, memadukan huruf besar-kecil, angka, dan simbol, tidak berisi data pribadi, dan <b>berbeda untuk tiap akun</b>.</p><p>Tips: gunakan frasa sandi yang mudah kamu ingat tetapi sulit ditebak orang lain, dan pertimbangkan pengelola kata sandi tepercaya. Jangan pernah membagikan kata sandi, bahkan kepada teman dekat.</p>`)+D("📲 Verifikasi dua langkah (2FA)",`<p>Autentikasi dua faktor menambah lapisan pengaman: selain kata sandi, kamu harus memasukkan kode kedua (misalnya dari aplikasi autentikator atau SMS). Jika kata sandimu bocor, akunmu tetap lebih sulit dibobol.</p><p>Ingat: kode OTP bersifat rahasia. <b>Tidak ada petugas resmi yang akan meminta OTP-mu.</b></p>`)+D("🎣 Phishing dan penipuan online",`<p>Phishing adalah upaya menipu agar kita menyerahkan data (kata sandi, OTP, nomor kartu) lewat pesan atau situs palsu yang tampak resmi.</p><p><b>Ciri-cirinya:</b> hadiah atau undian yang tidak pernah kamu ikuti, nada mendesak (“segera, atau akunmu diblokir”), tautan aneh atau alamat situs yang sedikit berbeda dari aslinya, dan permintaan data sensitif.</p><p><b>Yang harus dilakukan:</b> jangan klik, jangan isi data, blokir dan laporkan pengirim, lalu ceritakan pada orang tua atau guru. Jika sudah terlanjur, segera ganti kata sandi dan hubungi pihak terkait.</p>`)+D("🏠 Melindungi data pribadi",`<p>Data pribadi meliputi nama lengkap, alamat, nomor telepon, nomor identitas, lokasi, kata sandi, dan foto yang memuat informasi sensitif. Data ini bisa dipakai untuk penipuan, pencurian identitas, atau bahkan kejahatan di dunia nyata.</p><p>Biasakan: atur akun media sosial agar tidak publik, jangan mengunggah rencana bepergian atau rumah kosong, periksa izin aplikasi, dan hindari login atau transaksi penting memakai <b>Wi-Fi publik</b> yang tidak aman karena lalu lintas datamu bisa disadap.</p>`)+nav("konsep","eks2");
S.eks2=()=>`<h2>Eksplorasi 2: Etis dan Budaya Digital</h2><p class="note">Klik tiap judul untuk membaca penjelasan lengkapnya.</p>`+D("👣 Jejak digital",`<p>Jejak digital adalah rekam aktivitas online yang tertinggal. Ada dua jenis: <b>jejak aktif</b> (yang sengaja kamu buat: unggahan, komentar, foto) dan <b>jejak pasif</b> (yang terekam tanpa kamu sadari: riwayat penelusuran, lokasi, cookie).</p><p>Jejak digital sulit dihapus sepenuhnya, sebab unggahan bisa disimpan atau ditangkap layar orang lain. Pihak sekolah, penyelenggara beasiswa, atau perusahaan bisa melihatnya di masa depan, sehingga jejak yang baik menjadi aset reputasi, sedangkan jejak buruk bisa merugikan.</p><p><b>Tips:</b> pikir sebelum posting, periksa pengaturan privasi, dan rutin meninjau unggahan lama.</p>`)+D("💬 Netiket (etika berinternet)",`<p>Netiket adalah aturan sopan santun saat berkomunikasi online. Prinsipnya: perlakukan orang lain seperti kamu ingin diperlakukan.</p><p>Contohnya: gunakan bahasa yang santun, hindari menulis dengan huruf kapital semua (terkesan membentak), hormati perbedaan pendapat, jangan menyebarkan data atau foto orang lain tanpa izin, dan hindari SARA.</p><p>Sebelum memposting atau berkomentar, tanyakan: <b>Benar? Perlu? Baik? Aman?</b> Pesan teks tidak membawa nada suara, jadi kata-kata bisa terasa lebih kasar daripada maksudmu.</p>`)+D("🛡️ Perundungan siber (cyberbullying)",`<p>Perundungan siber adalah perilaku menyakiti, mempermalukan, atau mengancam orang lain lewat media digital, dan bisa terjadi terus-menerus karena jejaknya mudah tersebar. Bentuknya antara lain: <b>menghina atau mengejek</b>, <b>menyebar foto atau rahasia</b> tanpa izin, <b>mengucilkan</b> dari grup, dan <b>menyamar</b> memakai akun orang lain.</p><p><b>Dampaknya serius:</b> korban bisa merasa takut, malu, cemas, sulit berkonsentrasi, hingga menarik diri dari pergaulan.</p><p><b>Jika kamu korban:</b> jangan membalas, simpan bukti (tangkapan layar), blokir dan laporkan akun, lalu ceritakan pada orang dewasa tepercaya. <b>Jika kamu saksi:</b> jangan ikut menyebarkan, dukung korban, dan laporkan. Perilaku tertentu di dunia digital juga dapat berkonsekuensi hukum.</p>`)+D("©️ Hak cipta dan plagiarisme",`<p>Hak cipta melindungi karya (tulisan, gambar, musik, video, program) milik penciptanya. Memakai karya orang lain tanpa izin atau tanpa menyebut sumbernya disebut <b>plagiarisme</b>, dan itu tidak jujur.</p><p>Cara menghargai: <b>cantumkan sumber</b> (nama pembuat, judul, tautan), pakai karya yang berlisensi terbuka (misalnya <b>Creative Commons</b>) sesuai syaratnya, tulis ulang dengan kata-katamu sendiri saat merangkum, dan minta izin bila perlu. Menghapus watermark atau mengubah sedikit karya orang lain tidak membuatnya menjadi milikmu.</p>`)+D("🇮🇩 Budaya digital: bhinneka di ruang maya",`<p>Indonesia beragam suku, agama, dan budaya, dan keragaman itu hadir juga di dunia digital. Budaya digital berarti membawa nilai Pancasila ke dunia maya: menghargai perbedaan, bergotong royong, dan menjaga persatuan.</p><p>Contoh sikap: tidak menyebarkan ujaran kebencian, tidak mengejek perbedaan, menyebarkan konten positif dan edukatif, serta ikut melestarikan budaya lewat karya digital. Jadilah warga digital yang membuat ruang online lebih nyaman bagi semua.</p>`)+nav("eks1","misi");

addEventListener("resize",fitCover);
S.menu=()=>{const T=[["t1","🚪","Gerbang Misi","Tujuan dan petunjuk belajar","tujuan","tujuan"],["t2","🏛️","Menara Pustaka","Konsep dan 4 pilar","konsep","konsep"],["t3","⚓","Pelabuhan Eksplorasi","Cakap, aman, etis, budaya","eks1","eks1"],["t4","🛒","Pasar Hoaks","Misi detektif hoaks","misi","misi"],["t5","💎","Arena Kristal","20 soal evaluasi","evalmulai","hasil"],["t6","🏠","Rumah Pengembang","Profil dan penutup","tutup","tutup"]];const d=T.filter(t=>visited[t[5]]).length;
return `<h2>Peta Kota Cyberia</h2><div class="mh"><div><div class="hero"><img src="${IMG.hero}" alt="Siswa dan robot pemandu"></div><div class="panel prog"><b>Progres petualangan: ${d} dari 6 lokasi</b><div class="bar"><i style="width:${d/6*100}%"></i></div><p style="margin:0">${d==0?"Mulai dari Gerbang Misi, lalu telusuri Menara Pustaka.":d<6?"Bagus! Lanjutkan ke lokasi yang belum bertanda ✓.":"Hebat! Semua lokasi sudah dijelajahi. 🎉"}</p></div></div><div class="tiles">${T.map(t=>`<button class="tile ${t[0]}" onclick="go('${t[4]}')"><span class="ico">${t[1]}</span><strong>${t[2]}</strong><small>${t[3]}</small>${visited[t[5]]?'<i class="chk">✓</i>':""}</button>`).join("")}</div></div><p><button class="btn g" onclick="go('cover')">Kembali ke Sampul</button></p>`};
S.evalmulai=()=>`<h2>Arena Kristal: Evaluasi</h2><div class="mh"><div class="hero"><img src="${IMG.hero}" alt=""></div><div><div class="panel"><p style="margin-top:0"><b>Aturan main:</b></p><ul><li>20 soal: 16 pilihan ganda dan 4 benar-salah.</li><li>Jawaban benar membuka respons sukses dan pembahasan.</li><li>Jawaban salah mendapat petunjuk dan boleh dicoba lagi.</li><li>Nilai dihitung otomatis dari jawaban benar pada percobaan pertama (× 5).</li><li>Tiap jawaban benar pertama memberi +10 XP, dan jawaban beruntun menyalakan 🔥.</li></ul></div><button class="btn" onclick="qi=0;first=[];go('soal')">MULAI KUIS</button><button class="btn g" onclick="go('menu')">Beranda</button></div></div>`;
const MR=["Tanpa sumber, memancing emosi, dan meminta disebarkan.","Berasal dari akun resmi, ada tanggal dan kontak.","Foto lama dari kota lain dipakai untuk peristiwa baru (konteks salah).","Tautan dan permintaan OTP adalah ciri phishing.","Ada penulis, tanggal, narasumber, dan dikonfirmasi media lain.","Klaim ajaib tanpa bukti ilmiah."];
S.misi=()=>{const n=Object.values(misi).filter(x=>x.ok).length,d=Object.keys(misi).length;return `<h2>Misi: Perburuan Hoaks di Pasar Data</h2><p>Tentukan tiap unggahan: <b>Fakta</b> atau <b>Hoaks</b>. Kristal terkumpul: 💎 ${n} / 6</p><div class="bar"><i style="width:${n/6*100}%"></i></div>`+MISI.map((m,i)=>`<div class="card"><p style="margin:0 0 8px"><b>${i+1}.</b> ${m[0]}</p>${misi[i]?`<div class="fb ${misi[i].ok?"ok":"no"}" style="margin:0;padding:10px 14px"><big style="font-size:32px">${misi[i].ok?"✅":"❌"}</big><div><b>${misi[i].ok?"Tepat!":"Belum tepat."} Jawabannya: ${m[1]?"Hoaks":"Fakta"}.</b><br>${MR[i]}</div></div>`:`<button class="btn t" onclick="mj(${i},0)">FAKTA</button><button class="btn" onclick="mj(${i},1)">HOAKS</button>`}</div>`).join("")+(d==6?`<div class="fb ${n>4?"ok":"no"}"><big>${n>4?"🏅":"📚"}</big><div><b>${n>4?"Detektif Hoaks Hebat!":n>2?"Hampir! Cek lagi ciri hoaks.":"Ayo pelajari materi cek fakta lagi."}</b><br><button class="btn t" onclick="go('eks1')">Pelajari Ulang</button></div></div>`:"")+nav("eks2","evalmulai")};
mj=function(i,v){if(misi[i])return;const ok=MISI[i][1]===v,y=window.scrollY;misi[i]={ok};if(ok){xp+=5;burst()}toast(ok?"✅ Tepat! +5 XP":"❌ Belum tepat. Baca penjelasannya ya.");render("misi");window.scrollTo(0,y)};
soal=function(fb,sel){const q=Q[qi],done=fb==="ok",bs=q[1].length==2,c=first.filter(x=>x===1).length;const T={k:"Konsep",a:"Cakap dan Aman Digital",e:"Etis dan Budaya Digital"}[G[qi]];
const ops=q[1].map((o,i)=>{let cl="opt"+(bs?" bs":"");if(done&&i===q[2])cl+=" y";else if(fb==="no"&&i===sel)cl+=" x";return `<button class="${cl}" ${done?"disabled":""} onclick="ans(${i})">${bs?(i?"❌ ":"✅ "):"ABCD"[i]+". "}${o}</button>`}).join("");
const msg=streak>=3?`<p>🔥 Kamu sudah ${streak} soal beruntun!</p>`:"";
return `<div class="qwrap"><aside class="qside"><img src="${IMG.boy}" alt=""><div class="stat"><b>${qi+1}/20</b><span>Soal</span></div><div class="stat"><b>${c}</b><span>Benar pertama</span></div><div class="stat"><b>🔥 ${streak}</b><span>Beruntun</span></div></aside><section><div class="bar"><i style="width:${(qi+(done?1:0))/20*100}%"></i></div><div class="panel"><span class="tag">${T}${bs?" · Benar-Salah":""}</span><p class="qt">${q[0]}</p></div><div class="ops${bs?" two":""}">${ops}</div>`+(done?`<div class="fb ok"><big>🌟</big><div><b>Hebat! Jawaban kamu benar. Teruskan petualanganmu!</b><p>${q[3]}</p>${msg}<button class="btn o" onclick="nextQ()">${qi==19?"LIHAT HASIL":"LANJUT"}</button></div></div>`:fb==="no"?`<div class="fb no"><big>💪</big><div><b>Belum tepat, ayo coba lagi! Kamu pasti bisa!</b><p>Petunjuk: ${q[4]}</p><button class="btn t" onclick="render('soal')">COBA LAGI</button></div></div>`:"")+`<p><button class="btn g" onclick="go('menu')">Beranda</button></p></section></div>`};
ans=function(i){const ok=i===Q[qi][2];if(first[qi]===undefined){first[qi]=ok?1:0;if(ok){streak++;xp+=10}else streak=0}A.innerHTML=hdr()+soal(ok?"ok":"no",i);if(ok)burst();const f=A.querySelector(".fb");if(f)f.scrollIntoView({behavior:"smooth",block:"center"})};
const _r=render;
render=function(s){if(s==="soal"&&qi===0&&first.length===0)streak=0;if(KEYS.includes(s)&&!visited[s]){visited[s]=1;xp+=10;setTimeout(()=>toast(MSG[s]),300)}_r(s);document.body.dataset.s=s;if(s==="cover")fitCover();if(s!=="cover")A.insertAdjacentHTML("afterbegin",hdr());if(s==="hasil"&&first.filter(x=>x===1).length>=14)burst()};
render("cover");
</script></body></html>
